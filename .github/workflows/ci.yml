name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # `xcode-27` is GitHub's macOS 27 image with Xcode 27 (in preview); bump both lines when GitHub's images change.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Logic tests
        run: swift test --package-path Packages/OnlyWorkoutKit

      - name: Build iOS app
        run: >
          xcodebuild -project OnlyWorkout.xcodeproj -scheme OnlyWorkout
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Formatting
        run: xcrun swift-format lint --strict --recursive Packages/OnlyWorkoutKit/Sources Packages/OnlyWorkoutKit/Tests OnlyWorkout OnlyWorkoutWidgets OnlyWorkoutWatch OnlyWorkoutWatchWidgets SharedUI OnlyWorkoutUITests

  database:
    # pgTAP tests for the schema, RLS and sync RPCs; Linux because the local stack needs Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start database
        run: supabase db start

      - name: pgTAP tests
        run: supabase test db

  functions:
    # Strava rules of the Edge Functions (supabase/functions/_shared), against a stubbed fetch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formatting
        run: deno fmt --check --line-width 120 supabase/functions

      - name: Deno tests
        run: deno test --no-lock --allow-env supabase/functions
